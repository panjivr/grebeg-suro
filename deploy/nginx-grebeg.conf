# ============================================================
#  Grebeg Suro — Nginx vhost (SUBDOMAIN, coexist dgn sistem lain)
#  Domain : absensi.103-31-38-106.sslip.io  -> 127.0.0.1:3100
#
#  CARA PAKAI (nginx host yang memegang 80/443):
#    1) sudo cp deploy/nginx-grebeg.conf /etc/nginx/conf.d/grebeg-suro.conf
#    2) sudo nginx -t && sudo systemctl reload nginx
#    3) sudo certbot --nginx -d absensi.103-31-38-106.sslip.io --redirect \
#            --agree-tos -m EMAIL_ASLI@kamu.com
#       => Certbot OTOMATIS menambah blok `listen 443 ssl` (path cert LE) +
#          mengubah blok 80 ini jadi redirect 80->443.
#
#  Kenapa blok 443 TIDAK ditulis live di sini?
#    `listen 443 ssl` butuh file cert SUDAH ada. Bila ditulis sebelum cert
#    terbit, `nginx -t` GAGAL dan certbot ikut gagal (chicken-and-egg).
#    Maka blok 443 disediakan sebagai REFERENSI di bawah (lihat) — certbot
#    membuat blok yang persis sama. Bila mau manual: un-comment blok 443
#    HANYA setelah cert terbit.
#
#  SENGAJA TANPA `Strict-Transport-Security` (HSTS): jangan kunci subdomain
#  via HSTS dari sisi app/nginx kita. HSTS yang muncul di browser berasal
#  dari domain ROOT (sistem lain), bukan dari config ini.
#
#  Jika 80/443 dipegang Nginx di DOCKER (sistem arbitrage): JANGAN pakai file
#  ini. Tambahkan server block ke config Nginx Docker tsb, proxy_pass ke
#  http://103.31.38.106:3100, dan terbitkan cert lewat mekanisme stack itu.
# ============================================================

# ---- HTTP (port 80) : proxy + ACME challenge ----
# Setelah `certbot --redirect`, certbot menyisipkan redirect 80->443 di sini.
server {
    listen 80;
    listen [::]:80;
    server_name absensi.103-31-38-106.sslip.io;

    client_max_body_size 12M;   # upload selfie

    # ACME http-01 (bila pakai mode webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}


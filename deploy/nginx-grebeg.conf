# ============================================================
#  Grebeg Suro — Nginx vhost (SUBDOMAIN, coexist dgn sistem lain)
#  Domain : absensi.103-31-38-106.sslip.io  → 127.0.0.1:3100
#
#  Taruh di: /etc/nginx/conf.d/grebeg-suro.conf
#  lalu:     nginx -t && systemctl reload nginx
#            certbot --nginx -d absensi.103-31-38-106.sslip.io
#
#  ⚠️ Hanya berlaku bila NGINX NATIVE (host) yang memegang port 80/443.
#     Jika port 80/443 dipegang Nginx milik sistem arbitrage di DOCKER,
#     JANGAN pasang file ini — tambahkan blok server di bawah ke dalam
#     konfigurasi Nginx Docker tsb, dan proxy_pass ke http://<IP-HOST>:3100.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name absensi.103-31-38-106.sslip.io;

    client_max_body_size 12M;   # upload selfie

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# Catatan: blok 'listen 443 ssl' + redirect HTTP→HTTPS akan DITAMBAHKAN
# OTOMATIS oleh:  certbot --nginx -d absensi.103-31-38-106.sslip.io
# Jadi tidak perlu menulis konfigurasi SSL manual di sini.

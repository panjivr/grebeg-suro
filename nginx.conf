# ============================================================
#  Grebeg Suro — Nginx reverse proxy
#  Domain: 157-10-253-86.sslip.io
#  NOTE: Camera & GPS APIs require HTTPS (secure context).
# ============================================================

upstream grebeg_app {
    server app:3000;
}

# ---- HTTP : redirect to HTTPS ----
server {
    listen 80;
    server_name 157-10-253-86.sslip.io 157.10.253.86;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name 157-10-253-86.sslip.io 157.10.253.86;

    # Place certs in ./certs (mounted to /etc/nginx/certs)
    # Self-signed for quick start, or Let's Encrypt fullchain/privkey.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 12M;   # selfie uploads

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;

    location / {
        proxy_pass http://grebeg_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache Next.js static assets
    location /_next/static/ {
        proxy_pass http://grebeg_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
